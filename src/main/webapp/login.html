<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | BookSwap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <a class="brand" href="index.html" style="color:#fff"><span class="brand-mark" aria-hidden="true"></span>BookSwap</a>
      <div>
        <h2>Pick up where you left off.</h2>
        <p>Check new requests, browse fresh listings and finish your exchanges.</p>
      </div>
      <div class="shelf" aria-hidden="true">
  <div class="spine" style="height:250px;background-color:var(--spine-3)">Algorithms</div>
  <div class="spine" style="height:205px;background-color:var(--spine-0)">Databases</div>
  <div class="spine" style="height:270px;background-color:var(--spine-2)">Programming</div>
  <div class="spine" style="height:225px;background-color:var(--spine-1)">Mathematics</div>
  <div class="spine" style="height:280px;background-color:var(--spine-5)">Operating Systems</div>
  <div class="spine" style="height:200px;background-color:var(--spine-4)">Physics</div>
  <div class="spine" style="height:240px;background-color:var(--spine-3)">Networking</div>
</div>
    </aside>
    <main class="auth-main">
      <div class="auth-card">
        <h1>Log in</h1>
        <p class="muted">Use the email you registered with.</p>
        <div id="notice" class="notice" role="alert"></div>
        <form class="stack" method="post" action="login">
          <div class="field">
            <label for="email">College email</label>
            <input class="input" type="email" id="email" name="email" required autocomplete="username">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary" type="submit">Log in</button>
        </form>
        <p class="alt">New here? <a href="register.html">Create an account</a></p>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
